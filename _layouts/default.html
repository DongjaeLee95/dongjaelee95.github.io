<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-STJWD73E3Y"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-STJWD73E3Y');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal homepage of Dongjae Lee">
    <title>{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Lato', Verdana, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #222;
            font-size: 15px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a { color: #1772d0; text-decoration: none; }
        a:hover, a:focus { color: #f09228; text-decoration: none; cursor: pointer; }

        .page {
            max-width: 760px;
            margin: 0 auto;
            padding: 48px 20px 60px;
        }

        /* ---------- Profile header ---------- */
        .profile {
            display: flex;
            flex-wrap: wrap-reverse;
            align-items: stretch;
            justify-content: center;
            gap: 28px;
            text-align: center;
        }

        .profile-photo {
            flex: 0 0 auto;
        }

        .profile-photo img {
            width: 150px;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .profile-text { flex: 1 1 380px; }

        .profile-text h1 {
            font-size: 2.2em;
            margin: 0 0 6px 0;
        }

        .profile-text .position {
            margin: 0 0 14px 0;
            color: #444;
        }

        .profile-links {
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 18px;
        }

        .profile-links a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .link-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* ---------- Bio ---------- */
        .bio {
            text-align: left;
            margin-top: 32px;
        }

        .bio p { margin: 0 0 1em 0; }

        /* ---------- Section headings ---------- */
        section.block {
            margin-top: 36px;
            padding-top: 28px;
            border-top: 1px solid #e5e5e5;
        }

        section.block h2 {
            text-align: left;
            font-size: 1.4em;
            margin: 0 0 14px 0;
        }

        section.block > p.subnote {
            margin: -8px 0 14px 0;
            font-size: 0.85em;
            color: #666;
        }

        /* ---------- News ---------- */
        #news-container {
            list-style-position: outside;
            margin: 0;
            padding-left: 1.25em;
        }

        #news-container li { margin-bottom: 8px; }

        #news-toggle {
            cursor: pointer;
            margin-top: 12px;
            color: #1772d0;
            user-select: none;
            font-size: 0.95em;
        }

        #news-toggle:hover { color: #f09228; text-decoration: underline; }

        /* ---------- Publications ---------- */
        .pub-list { margin-top: 4px; }

        .pub-item {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .pub-item:last-child { border-bottom: none; }

        .pub-thumb {
            flex: 0 0 260px;
            max-width: 260px;
        }

        .pub-thumb img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            cursor: pointer;
            display: block;
        }

        .pub-text { flex: 1 1 auto; min-width: 0; }

        .pub-text.pub-featured { background-color: #fff7dc; border-radius: 6px; padding: 10px 12px; margin: -10px -12px; }

        .pub-title { font-weight: 700; margin: 0 0 6px 0; }
        .pub-authors { margin: 0 0 4px 0; }
        .pub-venue { margin: 0 0 4px 0; color: #333; }
        .pub-award { margin: 0 0 4px 0; }
        .pub-links { margin: 4px 0 0 0; }

        @media (max-width: 560px) {
            .pub-item { flex-direction: column; }
            .pub-thumb { max-width: 100%; }
        }

        /* ---------- Image modal ---------- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            padding-top: 100px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.9);
        }

        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
        }

        .modal-content img { width: 100%; height: auto; }

        .close {
            color: #aaaaaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover, .close:focus { color: #fff; cursor: pointer; }

        footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    {% include icon-sprite.html %}

    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="img01">
    </div>

    <script>
        function openModal(src) {
            var modal = document.getElementById("myModal");
            var modalImg = document.getElementById("img01");
            modal.style.display = "block";
            modalImg.src = src;
            var span = document.getElementsByClassName("close")[0];
            span.onclick = function() {
                modal.style.display = "none";
            }
        }
    </script>

    <div class="page">
        {{ content }}
    </div>

    <footer>
        <p>Last updated: {{ site.last-updated }}</p>
    </footer>
</body>
</html>
